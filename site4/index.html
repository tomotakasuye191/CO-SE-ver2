<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商品選択</title>
<style>
  :root{
    --ink:#1c2b24;
    --paper:#f6f4ee;
    --line:#c9c2ae;
    --accent:#2f5d4f;
    --accent-soft:#e4ece7;
    --error:#a3402f;
    --base-badge:#b5842e;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    background:var(--paper);
    color:var(--ink);
    font-family:"Hiragino Sans","Yu Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
    padding:12px 14px 24px;
  }
  .wrap{ max-width:1440px; margin:0 auto; }
  .top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:3px;
  }
  .eyebrow{
    font-size:10.5px;
    letter-spacing:.12em;
    color:var(--accent);
    font-weight:700;
  }
  .progress{ font-size:10.5px; color:#7a8279; }
  .timer-badge{
    display:inline-block;
    margin-left:10px;
    padding:2px 9px;
    border-radius:10px;
    font-size:11px;
    font-weight:700;
    background:var(--accent-soft);
    color:var(--accent);
    letter-spacing:.02em;
  }
  .timer-badge.warn{ background:#fbeae6; color:var(--error); }
  .timeout-overlay{
    position:fixed;
    inset:0;
    background:rgba(28,43,36,.55);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:50;
  }
  .timeout-box{
    background:#fff;
    border-radius:2px;
    padding:28px 36px;
    text-align:center;
    font-size:16px;
    font-weight:700;
    color:var(--error);
    box-shadow:0 6px 24px rgba(0,0,0,.2);
  }
  h1{
    font-size:15px;
    line-height:1.5;
    margin:4px 0 4px;
    font-weight:700;
  }
  p.desc{
    font-size:11.5px;
    line-height:1.6;
    color:#4b554e;
    margin:0 0 10px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(96px, 1fr));
    gap:6px;
  }
  .slide-layout{
    display:flex;
    align-items:flex-start;
    gap:14px;
  }
  .base-panel{
    flex:0 0 148px;
    position:sticky;
    top:12px;
  }
  .base-panel .card{ cursor:pointer; }
  .candidates-panel{
    flex:1;
    min-width:0;
    max-height:calc(100vh - 130px);
    overflow-y:auto;
    padding-right:4px;
  }
  @media (max-width: 720px){
    .slide-layout{ flex-direction:column; }
    .base-panel{ position:static; width:100%; flex:none; }
    .candidates-panel{ max-height:none; overflow-y:visible; width:100%; }
  }
  .card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:3px;
    padding:5px;
    cursor:pointer;
    transition:border-color .12s, transform .08s;
    display:flex;
    flex-direction:column;
  }
  .card:hover{ border-color:var(--accent); transform:translateY(-1px); }
  .card.base{
    border:2px solid var(--base-badge);
    background:#fdf7ec;
  }
  .badge{
    display:inline-block;
    font-size:8px;
    font-weight:700;
    color:#fff;
    background:var(--base-badge);
    padding:1px 5px;
    border-radius:8px;
    margin-bottom:4px;
    align-self:flex-start;
  }
  .thumb{
    width:100%;
    aspect-ratio:1/1;
    background:#fff;
    border:1px solid #ece7db;
    border-radius:2px;
    overflow:hidden;
    margin-bottom:3px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:3px;
  }
  .thumb img{ width:100%; height:100%; object-fit:contain; }
  .thumb.noimg{
    background:var(--accent-soft);
    font-size:9px;
    color:var(--accent);
    font-weight:600;
    text-align:center;
    padding:4px;
  }
  .pname{
    font-size:9px;
    font-weight:700;
    line-height:1.3;
    margin-bottom:3px;
    min-height:2.1em;
  }
  .attrs{ font-size:8.2px; color:#4b554e; line-height:1.4; }
  .attrs div{ display:flex; justify-content:space-between; gap:3px; }
  .attrs span.k{ color:#8a9189; flex:0 0 auto; }
  .attrs span.v{ text-align:right; }

  .intro-card .thumb{ cursor:pointer; }

  .transition-screen{
    max-width:560px;
    margin:100px auto;
    text-align:center;
    background:#fff;
    border:1px solid var(--line);
    border-radius:3px;
    padding:44px 36px;
    position:relative;
  }
  .transition-screen::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0;
    height:4px;
    background:var(--accent);
  }
  .transition-screen h1{ font-size:19px; margin:0 0 16px; }
  .transition-screen p{ font-size:14px; line-height:1.9; color:#4b554e; margin:0 0 26px; }
  .transition-screen button{
    padding:13px 32px;
    font-size:14px;
    font-weight:700;
    border:none;
    border-radius:2px;
    background:var(--accent);
    color:#fff;
    cursor:pointer;
  }

  .loading-screen, .end-screen, .error-screen{
    max-width:520px;
    margin:80px auto;
    text-align:center;
  }
  .spinner{
    width:34px; height:34px;
    margin:0 auto 22px;
    border:3px solid var(--line);
    border-top-color:var(--accent);
    border-radius:50%;
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .error-box{
    color:var(--error);
    background:#fbeae6;
    border:1px solid #e6c3ba;
    padding:14px 16px;
    border-radius:2px;
    font-size:13px;
    text-align:left;
  }
  button.retry{
    margin-top:16px;
    padding:10px 20px;
    font-size:13px;
    font-weight:700;
    border:none;
    border-radius:2px;
    background:var(--accent);
    color:#fff;
    cursor:pointer;
  }

  .fam-screen{ max-width:640px; margin:40px auto; }
  .fam-card{ background:#fff; border:1px solid var(--line); border-radius:3px; padding:16px; margin-bottom:14px; display:flex; gap:14px; align-items:center; }
  .fam-card .thumb{ flex:0 0 110px; width:110px; margin:0; cursor:default; }
  .fam-body{ flex:1; min-width:0; }
  .fam-name{ font-size:13px; font-weight:700; margin-bottom:8px; line-height:1.4; }
  .fam-scale{ display:flex; gap:6px; flex-wrap:wrap; }
  .fam-scale label{ display:flex; flex-direction:column; align-items:center; font-size:11px; color:#4b554e; cursor:pointer; min-width:44px; }
  .fam-scale input{ margin:4px 0 2px; }
  .fam-ends{ display:flex; justify-content:space-between; font-size:10.5px; color:#7a8279; margin-top:4px; }
  .fam-title{ font-size:17px; font-weight:700; margin:0 0 8px; }
  .fam-desc{ font-size:13px; line-height:1.7; color:#4b554e; margin:0 0 16px; }
  button.primary{ padding:12px 28px; font-size:14px; font-weight:700; border:none; border-radius:2px; background:var(--accent); color:#fff; cursor:pointer; }
  button.primary:disabled{ background:#b9c3be; cursor:not-allowed; }
</style>
</head>
<body>
  <div class="wrap" id="app">
    <div class="loading-screen">
      <div class="spinner"></div>
      <p>読み込んでいます…</p>
    </div>
  </div>

<script src="../data/config.js"></script>
<script src="../data/products.js"></script>
<script src="../data/products_round2.js"></script>
<script src="../data/product_levels.js"></script>
<script src="../data/conjoint_defs.js"></script>
<script src="../data/conjoint_engine.js"></script>
<script src="../data/co_design.js"></script>
<script>
(function(){

  const CFG = window.EXP_CONFIG;
  const GAS_URL = CFG.GAS_URL;
  const BASE_URL = CFG.BASE_URL;
  const TIME_LIMIT_SEC = Number(CFG.CO_TIME_LIMIT_SEC) || 0;   // 0 = 制限なし(ver2) / 25 = 時間制限あり(ver3)

  const GOOD_LABELS = { yogurt:'ヨーグルト', rice:'お米', wine:'ワイン', chocolate:'チョコレート' };

  // 各財：画像を除く5属性の表示キーとラベル（順番も表示順）。パッケージは画像で表現される。
  const FIELD_DEFS = {
    yogurt: [['price','価格'],['volume','内容量'],['expiry','消費期限'],['nutrition','栄養情報'],['calorie','カロリー']],
    rice: [['price','価格'],['origin','産地'],['volume','内容量'],['harvest','精米時期'],['polish','精米度合い']],
    wine: [['price','価格'],['origin','ブドウ産地'],['abv','アルコール度数'],['color','色'],['taste','味わい']],
    chocolate: [['price','価格'],['cacao_percent','カカオ量'],['trait','特定の効果の有無'],['calorie','カロリー'],['fairtrade','フェアトレード']]
  };
  const SIZES = window.CODesign.SIZES;

  // ---- パラメータ取得 ----
  const urlParams = new URLSearchParams(window.location.search);
  function getParam(key){
    return urlParams.get(key) || sessionStorage.getItem('experiment_' + key) || '';
  }
  const id = getParam('id');
  const group = getParam('group');
  const good1 = getParam('good1');
  const good2 = getParam('good2');
  const current = getParam('current') || '1';
  const gender = getParam('gender');
  const age = getParam('age');
  const good = urlParams.get('good') || (current === '1' ? good1 : good2);

  function parseLU(){
    let raw = urlParams.get('lu');
    if(!raw){ try{ raw = sessionStorage.getItem('experiment_lu_' + good); }catch(e){} }
    if(!raw) return null;
    try{ return JSON.parse(raw); }catch(e){ return null; }
  }
  const lu = parseLU();

  try{
    sessionStorage.setItem('experiment_id', id);
    sessionStorage.setItem('experiment_group', group);
    sessionStorage.setItem('experiment_good1', good1);
    sessionStorage.setItem('experiment_good2', good2);
    sessionStorage.setItem('experiment_current', current);
    sessionStorage.setItem('experiment_gender', gender);
    sessionStorage.setItem('experiment_age', age);
    if(lu) sessionStorage.setItem('experiment_lu_' + good, JSON.stringify(lu));
  }catch(e){}

  const app = document.getElementById('app');

  // GASのコールドスタート対策
  try{ fetch(GAS_URL, { method: 'GET', mode: 'no-cors' }).catch(function(){}); }catch(e){}

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function fail(msg, retryFn){
    const retryHtml = retryFn
      ? '<button class="retry" id="retryActionBtn">再送信する</button>'
      : '<button class="retry" onclick="location.reload()">再読み込み</button>';
    app.innerHTML = '<div class="error-screen"><div class="error-box">' + msg + '</div>' + retryHtml + '</div>';
    if(retryFn) document.getElementById('retryActionBtn').addEventListener('click', retryFn);
  }

  const DEF = window.CONJOINT_DEFS && window.CONJOINT_DEFS[good];
  if(!id || !good || !DEF || !window.PRODUCTS || !window.PRODUCTS[good]){
    fail('必要な情報が読み込めませんでした。最初のページからやり直してください。');
    return;
  }
  if(!window.PRODUCTS_ROUND2 || !window.PRODUCTS_ROUND2[good] || !window.PRODUCT_LEVELS || !window.PRODUCT_LEVELS[good]){
    fail('実験用データ（products_round2.js / product_levels.js）が読み込めませんでした。<br>サーバーに data フォルダが正しくアップロードされているか確認してください。');
    return;
  }
  if(!lu || DEF.attrs.some(function(a){ return !lu[a]; })){
    fail('必要な情報（コンジョイントの結果）が読み込めませんでした。最初のページからやり直してください。');
    return;
  }

  const goodLabel = GOOD_LABELS[good];
  const fieldDefs = FIELD_DEFS[good];
  const pool = window.CODesign.buildPool(good, window.PRODUCTS[good], window.PRODUCTS_ROUND2[good], window.PRODUCT_LEVELS[good]);
  const setup = window.CODesign.setup(good, DEF, lu, pool);
  if(!setup || !setup.sq){
    fail('基準となる商品を決められませんでした。最初のページからやり直してください。');
    return;
  }
  const A = setup.A;
  const SQ = setup.sq.sq;
  const sqOverrides = window.CODesign.modsToOverrides(DEF, setup.sq.mods);   // 基準財の表示上書き（ステップ2のときだけ）

  // ---- 表示 ----
  function formatValue(key, val){
    if(val === null || val === undefined) return '';
    if(key === 'price' && typeof val === 'number') return '¥' + val.toLocaleString('ja-JP');
    if(key === 'abv' && typeof val === 'number') return val + '%';
    if(key === 'cacao_percent' && typeof val === 'number') return val + '%';
    if(key === 'calorie' && typeof val === 'number') return val + 'kcal';
    if(key === 'volume' && typeof val === 'number') return val + (good === 'rice' ? 'kg' : 'g');
    if(key === 'expiry' && typeof val === 'number') return '製造から' + val + '日';
    return val;
  }

  function buildCard(product, opts){
    const el = document.createElement('div');
    el.className = 'card' + (opts.isBase ? ' base' : '');
    el.dataset.id = String(product.id);
    let inner = '';
    if(opts.isBase) inner += '<span class="badge">今回の基準の商品</span>';
    inner += '<div class="thumb"><img src="../images/' + product.image + '" alt="' + escapeHtml(product.name) + '"></div>';
    inner += '<div class="pname">' + escapeHtml(product.name) + '</div>';
    inner += '<div class="attrs">';
    fieldDefs.forEach(function(pair){
      const key = pair[0], label = pair[1];
      let val = product.attrs[key];
      if(opts.overrides && Object.prototype.hasOwnProperty.call(opts.overrides, key)) val = opts.overrides[key];
      inner += '<div><span class="k">' + label + '</span><span class="v">' + escapeHtml(formatValue(key, val)) + '</span></div>';
    });
    inner += '</div>';
    el.innerHTML = inner;
    return el;
  }

  // ---- ver3：制限時間（TIME_LIMIT_SEC > 0 のときだけ有効） ----
  function startCountdown(seconds, badgeEl, onTimeout){
    let remaining = seconds, done = false;
    function render(){
      badgeEl.textContent = '⏱ 残り' + remaining + '秒';
      badgeEl.classList.toggle('warn', remaining <= 10);
    }
    render();
    const intervalId = setInterval(function(){
      remaining -= 1;
      if(remaining <= 0){ render(); finish(); return; }
      render();
    }, 1000);
    function finish(){
      if(done) return;
      done = true;
      clearInterval(intervalId);
      onTimeout();
    }
    return { clear: function(){ if(done) return; done = true; clearInterval(intervalId); } };
  }
  function showTimeoutOverlay(callback){
    const overlay = document.createElement('div');
    overlay.className = 'timeout-overlay';
    overlay.innerHTML = '<div class="timeout-box">時間切れです</div>';
    document.body.appendChild(overlay);
    setTimeout(function(){ overlay.remove(); callback(); }, 1200);
  }

  // ---- 状態 ----
  const TOTAL_STEPS = SIZES.length * 2;
  let phase = 'round1';
  let remaining1 = [], remaining2 = [];
  const records = [];   // 各スライドの記録

  function currentStepNo(){
    if(phase === 'round1') return 1 + (SIZES.length - remaining1.length);
    return 1 + SIZES.length + (SIZES.length - remaining2.length);
  }

  function nextSlide(){
    if(phase === 'round1'){
      if(remaining1.length === 0){
        phase = 'round2';
        remaining2 = window.CODesign.shuffle(SIZES);
        renderRoundTransition();
        return;
      }
      renderSlide(1, remaining1.shift());
    } else {
      if(remaining2.length === 0){ renderFamiliarity(); return; }
      renderSlide(2, remaining2.shift());
    }
  }

  function renderRoundTransition(){
    app.innerHTML =
      '<div class="transition-screen">' +
        '<h1>ここまでで1回目の実験が終わりました</h1>' +
        '<p>ここからは条件を変えて、2回目の実験に入ります。<br>先ほどと同じように、' + goodLabel + 'を比較して選んでいただきます。</p>' +
        '<button id="toRound2Btn">2回目の実験を始める</button>' +
      '</div>';
    document.getElementById('toRound2Btn').addEventListener('click', nextSlide);
  }

  function chosenTypeOf(item){
    if(!item) return '基準財';
    if(item.isA) return 'A';
    if(item.isAprime) return 'Aprime';
    return 'その他';
  }

  function renderSlide(round, size){
    const slide = window.CODesign.composeSlide(DEF, lu, pool, setup, round, size);
    const items = slide.items;
    const t0 = Date.now();

    let html = '';
    html += '<div class="top"><span class="eyebrow">SITE 4 / ' + goodLabel + '（' + round + '回目）</span>' +
            '<span class="progress">STEP ' + currentStepNo() + ' / ' + TOTAL_STEPS + '（候補' + size + '個）</span>' +
            (TIME_LIMIT_SEC > 0 ? '<span class="timer-badge" id="timerBadge"></span>' : '') + '</div>';
    html += '<h1>今回選ぶなら、どちらにしますか？</h1>';
    html += '<p class="desc">左側は今回の基準となる商品です。右側をスクロールして他の候補と見比べ、気になったものをクリックしてください。左側をクリックすれば、基準の商品を選んだことになります。' +
            (TIME_LIMIT_SEC > 0 ? '<b>制限時間は' + TIME_LIMIT_SEC + '秒です。</b>' : '') + '</p>';
    html += '<div class="slide-layout"><div class="base-panel" id="basePanel"></div>' +
            '<div class="candidates-panel"><div class="grid" id="slideGrid"></div></div></div>';
    app.innerHTML = html;

    const basePanel = document.getElementById('basePanel');
    const grid = document.getElementById('slideGrid');
    basePanel.appendChild(buildCard(SQ, { isBase:true, overrides:sqOverrides }));
    items.forEach(function(it){
      grid.appendChild(buildCard(it.p, { isBase:false, overrides:it.overrides }));
    });

    let answered = false, timer = null;

    function commit(clickedId, timedOut){
      const rt = Date.now() - t0;
      let chosen = null, kept = false, type;
      if(timedOut){ type = '時間切れ'; }
      else if(String(clickedId) === String(SQ.id) && !items.some(function(x){ return String(x.p.id) === String(clickedId); })){
        kept = true; type = '基準財';
      } else {
        chosen = items.filter(function(x){ return String(x.p.id) === String(clickedId); })[0];
        type = chosenTypeOf(chosen);
      }
      records.push({
        round: round, size: size, rtMs: rt, timedOut: !!timedOut, kept: kept,
        chosenId: timedOut ? null : String(clickedId),
        chosenName: timedOut ? '(回答なし/時間切れ)' : (kept ? SQ.name : (chosen ? chosen.p.name : '')),
        chosenType: type,
        presentedIds: items.map(function(x){ return String(x.p.id); }),
        aPos: items.findIndex(function(x){ return x.isA; }) + 1,
        aprimeIds: items.filter(function(x){ return x.isAprime; }).map(function(x){ return String(x.p.id); }),
        aprimeFallbackIds: items.filter(function(x){ return x.isAprime && x.apOk === false; }).map(function(x){ return String(x.p.id); })
      });
      nextSlide();
    }

    const clickable = Array.from(basePanel.children).concat(Array.from(grid.children));
    clickable.forEach(function(cardEl){
      cardEl.addEventListener('click', function(){
        if(answered) return;
        answered = true;
        if(timer) timer.clear();
        commit(cardEl.dataset.id, false);
      });
    });

    if(TIME_LIMIT_SEC > 0){
      timer = startCountdown(TIME_LIMIT_SEC, document.getElementById('timerBadge'), function(){
        if(answered) return;
        answered = true;
        showTimeoutOverlay(function(){ commit(null, true); });
      });
    }
  }

  // ============================================================
  // 親近感（馴染み）の質問：基準財とAについて、5段階
  // ============================================================
  const famAnswers = {};
  function renderFamiliarity(){
    const order = window.CODesign.shuffle([ {key:'SQ', p:SQ}, {key:'A', p:A} ]);
    famAnswers._order = order.map(function(x){ return x.key; }).join(',');
    let html = '<div class="fam-screen">' +
      '<h1 class="fam-title">最後に、商品についてお伺いします</h1>' +
      '<p class="fam-desc">これまでの実験に出てきた次の2つの商品について、ふだんどのくらい馴染みがあるかをお答えください（見たことがある、買ったことがある、よく知っている、など）。</p>';
    order.forEach(function(x, idx){
      html += '<div class="fam-card"><div class="thumb"><img src="../images/' + x.p.image + '" alt=""></div>' +
        '<div class="fam-body"><div class="fam-name">商品' + (idx + 1) + '：' + escapeHtml(x.p.name) + '</div>' +
        '<div class="fam-scale">';
      for(let n = 1; n <= 5; n++){
        html += '<label><input type="radio" name="fam_' + x.key + '" value="' + n + '"><span>' + n + '</span></label>';
      }
      html += '</div><div class="fam-ends"><span>1：まったく馴染みがない</span><span>5：とても馴染みがある</span></div></div></div>';
    });
    html += '<div style="text-align:center;margin-top:18px;"><button class="primary" id="famSubmit" disabled>回答を送信して次へ</button></div></div>';
    app.innerHTML = html;
    const btn = document.getElementById('famSubmit');
    function update(){
      ['SQ','A'].forEach(function(k){
        const el = document.querySelector('input[name="fam_' + k + '"]:checked');
        famAnswers[k] = el ? Number(el.value) : null;
      });
      btn.disabled = !(famAnswers.SQ && famAnswers.A);
    }
    Array.from(document.querySelectorAll('.fam-scale input')).forEach(function(inp){ inp.addEventListener('change', update); });
    btn.addEventListener('click', function(){ update(); if(!btn.disabled) submitResults(); });
  }

  // ============================================================
  // 送信 & 次のステップへ
  // ============================================================
  function labelOf(attr){ return DEF.attrLabels[attr]; }

  function submitResults(){
    const payload = {
      action: 'submitCO', schema: 2, id: id, good: good,
      levelVersion: window.CONJOINT_VERSION, timeLimitSec: TIME_LIMIT_SEC,
      top2: setup.top2, top2Labels: setup.top2.map(labelOf),
      poolSize: pool.length,
      A: { id: String(A.id), name: A.name, round: A.round, norm: setup.ev.byId[String(A.id)].norm, u: setup.ev.byId[String(A.id)].u },
      SQ: {
        id: String(SQ.id), name: SQ.name, round: SQ.round, step: setup.sq.step,
        mods: Object.keys(setup.sq.mods).map(function(a){ return labelOf(a) + '→' + DEF.labels[a][setup.sq.mods[a]]; }),
        modCount: Object.keys(setup.sq.mods).length,
        norm: setup.sq.norm, u: setup.sq.u, rank: setup.sq.rank, gapRaw: setup.sq.gapRaw, gapNorm: setup.sq.gapNorm
      },
      aValues: DEF.attrs.map(function(a){ return labelOf(a) + ':' + (DEF.coding[a] === 'linear' ? A.v[a] : (A.v[a] >= 0 ? DEF.labels[a][A.v[a]] : '水準外')); }),
      reserveIds: setup.reserve.map(function(p){ return String(p.id); }),
      slides: records,
      familiarity: { SQ: famAnswers.SQ, A: famAnswers.A, order: famAnswers._order }
    };
    try{ sessionStorage.setItem('experiment_pendingCO_' + good, JSON.stringify(payload)); }catch(e){}
    sendCOPayload(payload);
  }

  // 通信エラー・サーバーエラーいずれの場合も 1,2,4,8,16秒間隔で最大5回自動リトライする
  const CO_RETRY_DELAYS_MS = [1000, 2000, 4000, 8000, 16000];

  function sendCOPayload(payload, attempt){
    attempt = attempt || 0;
    const attemptLabel = attempt > 0 ? '（自動再送信 ' + attempt + '/' + CO_RETRY_DELAYS_MS.length + ' 回目…）' : '';
    app.innerHTML = '<div class="loading-screen"><div class="spinner"></div><p>結果を記録しています…' + attemptLabel + '</p></div>';

    fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) })
      .then(function(res){
        return res.text().then(function(text){
          let parsed;
          try{ parsed = JSON.parse(text); }
          catch(e){ throw new Error('サーバーから予期しない応答（HTTP ' + res.status + '）: ' + text.slice(0, 200)); }
          return parsed;
        });
      })
      .then(function(data){
        if(data.status !== 'ok'){ retryOrFail(payload, attempt, (data.message || '記録に失敗しました。')); return; }
        try{ sessionStorage.removeItem('experiment_pendingCO_' + good); }catch(e){}
        goToNext();
      })
      .catch(function(err){ retryOrFail(payload, attempt, '通信エラーが発生しました：' + err.message); });
  }

  function retryOrFail(payload, attempt, message){
    if(attempt < CO_RETRY_DELAYS_MS.length){
      const delay = CO_RETRY_DELAYS_MS[attempt];
      app.innerHTML = '<div class="loading-screen"><div class="spinner"></div><p>' + escapeHtml(message) +
        '<br>' + Math.round(delay / 1000) + '秒後に自動で再送信します…</p></div>';
      setTimeout(function(){ sendCOPayload(payload, attempt + 1); }, delay);
      return;
    }
    fail(escapeHtml(message) + '<br>回答データは保存されているので、再送信できます。', function(){ sendCOPayload(payload, 0); });
  }

  function goToNext(){
    const query = new URLSearchParams({ id:id, group:group, good1:good1, good2:good2, current:current, gender:gender, age:age });
    const target = (current === '1') ? good1 : good2;
    window.location.href = BASE_URL + 'site5/' + target + '.html?' + query.toString();
  }

  // ---- 開始 ----
  function startExperiment(){
    remaining1 = window.CODesign.shuffle(SIZES);
    nextSlide();
  }

  // 直前のセッションで送信に失敗した回答が残っていれば、まずそれを再送信する
  let pendingRaw = null;
  try{ pendingRaw = sessionStorage.getItem('experiment_pendingCO_' + good); }catch(e){}
  if(pendingRaw){
    try{
      const pendingPayload = JSON.parse(pendingRaw);
      app.innerHTML = '<div class="loading-screen"><div class="spinner"></div><p>前回未送信だった回答が見つかりました。送信しています…</p></div>';
      sendCOPayload(pendingPayload);
    }catch(e){
      try{ sessionStorage.removeItem('experiment_pendingCO_' + good); }catch(e2){}
      startExperiment();
    }
  } else {
    startExperiment();
  }

})();
</script>
